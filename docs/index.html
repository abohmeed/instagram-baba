<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>أرشيف المنشورات</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg:#faf8f4; --fg:#2a2622; --muted:#6b635a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14120f; --fg:#efe7d6; --muted:#9a9186; } }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif;
         margin:0; padding:48px 16px; text-align:center; }
  h1 { font-weight:600; font-size:1.4rem; margin:0 0 8px; }
  p { color:var(--muted); max-width:38rem; margin:0 auto 24px; line-height:1.7; }
  code { background:color-mix(in srgb, var(--fg) 8%, transparent); padding:2px 6px; border-radius:4px; }
</style>
<h1>أرشيف المنشورات</h1>
<p>
  تُحفظ صور المنشورات في <code>posts/&lt;account&gt;/</code>.
  هذه الصفحة للأرشيف فقط؛ النشر يتم تلقائيًا عبر GitHub Actions.
</p>
