name: preview

# Renders throwaway sample images to iterate on the *design* (fonts, overlay,
# spacing) without touching the real library. For reviewing what will actually
# be posted, look at docs/library/<profile>/ after build-library has run.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to preview"
        required: true
        default: "mahmoudelfakharany8"
      count:
        description: "How many samples to render"
        required: false
        default: "6"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -m src.main --profile "${{ github.event.inputs.profile }}" \
            --preview "${{ github.event.inputs.count }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.inputs.profile }}
          path: out/
          retention-days: 14
